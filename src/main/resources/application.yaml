server:
  port: 8080
  shutdown: graceful
spring:
  application:
    name: crud-maven
  lifecycle:
    timeout-per-shutdown-phase: 25s
  datasource:
    url: jdbc:h2:mem:crud;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
